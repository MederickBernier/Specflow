name: Release

# Publishes the VS Code extension to the Marketplace and Open VSX when a
# version tag (v0.1.0) is pushed. Needs the VSCE_PAT and OVSX_PAT secrets,
# and packages/vscode/package.json's publisher and version to match.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: xvfb-run -a pnpm --filter specflow-vscode test:smoke
      - name: Check the tag matches the extension version
        run: test "v$(node -p "require('./packages/vscode/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm --filter specflow-vscode package
      - uses: actions/upload-artifact@v4
        with:
          name: specflow-vscode.vsix
          path: packages/vscode/specflow-vscode.vsix
      - name: Publish to the Visual Studio Marketplace
        run: pnpm --filter specflow-vscode exec vsce publish --packagePath specflow-vscode.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        run: pnpm --filter specflow-vscode exec ovsx publish specflow-vscode.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
