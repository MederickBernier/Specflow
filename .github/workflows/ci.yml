name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Extension smoke tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter specflow-vscode test:smoke
      - name: Extension smoke tests (Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter specflow-vscode test:smoke
